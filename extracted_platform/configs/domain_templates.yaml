    description: "Identify subtle edge-case errors, mutable default arguments, or scope leaks in Python code and provide corrected implementations."
    quality_requirements:
      min_answer_length: 120
      require_code_blocks: true
      require_reasoning: true
    prompt_guidelines:
      - "Present a snippet with a logical or concurrency flaw."
      - "Explain root cause and provide fixed code."

