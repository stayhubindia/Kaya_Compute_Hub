  # 1. PROGRAMMING TEMPLATES
  # ============================================================================
  - id: "programming_python_coding_beginner"
    domain: "programming"
    topic: "python"
    task_type: "coding"
    difficulty: "beginner"
    supported_difficulties: ["beginner", "intermediate"]
    objective: "implement_idiomatic_python_basics"
    description: "Construct clean, idiomatic Python solutions using standard library tools and proper type annotations."
    quality_requirements:
      min_answer_length: 80
      require_code_blocks: true
      require_examples: true
    prompt_guidelines:
      - "Ask for standard library usage (e.g., collections, itertools, pathlib)."
      - "Include input/output specification."

  - id: "programming_python_debugging_intermediate"
