# ==============================================================================
# Phase 4.1 — Production Training Specification for dataset-v2.0
# Target Model: Qwen/Qwen3-4B-Base
# Target Environment: NVIDIA Tesla T4 (16 GB VRAM) / Linux
# Dataset State: FROZEN (dataset-v2.0)
# ==============================================================================

model:
  name: "Qwen/Qwen3-4B-Base"
  path: "/content/drive/MyDrive/GoogleColab/AI/Qwen3/models/Qwen3-4B-Base"
  fallback_pretrained_id: "Qwen/Qwen2.5-3B"
  trust_remote_code: true
  torch_dtype: "bfloat16"

dataset:
  version: "dataset-v3.0"
  lifecycle: "FROZEN"
  manifest_path: "data/instruction_dataset/v3.0/manifests/dataset_manifest.json"
  train_file: "data/instruction_dataset/v3.0/splits/train.jsonl"
  validation_file: "data/instruction_dataset/v3.0/splits/validation.jsonl"
  test_file: "data/instruction_dataset/v3.0/splits/test.jsonl"
  require_frozen: true
  validate_sha256: true
  split_ratios:
    train: 0.90
    validation: 0.05
    test: 0.05

tokenizer:
  model_path: "/content/drive/MyDrive/GoogleColab/AI/Qwen3/models/Qwen3-4B-Base"
  fallback_pretrained_id: "Qwen/Qwen2.5-3B"
  max_seq_length: 2048
  truncation: true
  padding: false
  padding_side: "right"
  add_eos_token: false
  trust_remote_code: true

quantization:
  enabled: true
  bits: 4
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true
  compute_dtype: "bfloat16"
  fallback_compute_dtype: "float16"

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "/content/drive/MyDrive/GoogleColab/AI/Qwen3/training/dataset-v3.0/qlora-v3"
  local_fallback_output_dir: "outputs/training/dataset-v3.0/qlora-v3"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  optimizer_name: "paged_adamw_8bit"
  logging_steps: 5
  save_steps: 25
  eval_steps: 25
  save_total_limit: 3
  gradient_checkpointing: true
  mixed_precision: "auto"
  seed: 42
  dataloader_num_workers: 0
  assistant_only_loss: true

evaluation:
  enabled: true
  eval_strategy: "epoch"
  eval_steps: 25
  per_device_eval_batch_size: 1
  metrics:
    - "loss"
    - "perplexity"
  domain_stratified: true
  difficulty_stratified: true

checkpointing:
  enabled: true
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 3
  resume_enabled: true
  resume_from_checkpoint: null
  enforce_dataset_version_lock: true
