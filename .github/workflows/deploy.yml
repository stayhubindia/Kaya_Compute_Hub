name: Kaya Compute Hub CI/CD Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Base Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/vm-base.lock ]; then pip install -r requirements/vm-base.lock; fi

      - name: Compile Python Modules
        run: |
          python -m compileall services/ -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Frontend
        run: npm run build

  deploy-to-vm:
    name: Deploy to Production VM
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "15.252.100.159"
          username: "durgesh"
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            set -e
            echo "==== Deploying Kaya Compute Hub to /home/Project/Kaya_Compute_Hub ===="
            sudo mkdir -p /home/Project/Kaya_Compute_Hub
            sudo chown -R durgesh:durgesh /home/Project/Kaya_Compute_Hub
            
            cd /home/Project/Kaya_Compute_Hub
            if [ ! -d .git ]; then
              git clone https://github.com/stayhubindia/Kaya_Compute_Hub.git .
            else
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # Setup virtualenv if needed
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/venv/activate || source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements/vm-base.lock

            # Run Django migrations & static collect
            cd services/api
            python manage.py migrate --noinput

            # Build static assets
            cd /home/Project/Kaya_Compute_Hub
            npm ci || npm install
            npm run build

            # Restart services
            sudo systemctl restart kaya-api kaya-worker kaya-redis || true
            echo "==== Deployment Completed Successfully ===="
