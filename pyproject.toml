[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaya-compute-hub"
version = "0.1.0"
description = "Kaya Compute Hub - Dataset Factory & Training Orchestrator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pymupdf>=1.23.0",
    "pypdf>=3.17.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "django>=5.0.0",
    "djangorestframework>=3.14.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "peft>=0.8.0",
    "accelerate>=0.27.0",
    "datasets>=2.17.0",
    "bitsandbytes>=0.42.0",
    "trl>=0.8.0",
]
