[project]
name = "kaya-compute-api"
version = "0.1.0"
description = "Backend REST API Control Plane for Kaya Compute Hub"
authors = [{ name = "Kaya Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.2",
    "djangorestframework>=3.15.0",
    "django-filter>=24.0",
    "psycopg2-binary>=2.9.0",
    "dj-database-url>=2.1.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py", "tests.py"]
pythonpath = [".", ".."]
testpaths = ["tests", "../worker/tests"]
